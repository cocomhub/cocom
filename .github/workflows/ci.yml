name: test

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - 'LICENSE'
      - 'assets/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - '.gitignore'
      - '.editorconfig'
      - '.notestignore'
      - 'LICENSE'
      - 'assets/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    services:
      # 提供真实 MongoDB：否则 cmd/server 的集成测试会静默 t.Skip（等于零覆盖）。
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: cocom
          MONGO_INITDB_ROOT_PASSWORD: cocom
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})' --username cocom --password cocom --authenticationDatabase admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # 与上方 service 凭据一致。键→环境变量映射由 SetEnvKeyReplacer 完成，它只把 "." 与 "-"
      # 换成 "_"，**不会在单词内部插入下划线** —— 因此 `mongo.authSource` 对应
      # COCOM_MONGO_AUTHSOURCE；写成 COCOM_MONGO_AUTH_SOURCE 会被 viper 忽略，authSource
      # 回落到默认值 cocom，而 service 的 root 用户建在 admin 库 → 认证失败
      # → cmd/server 的集成测试静默 t.Skip（即该 job 看似在跑集成，实则零覆盖）。
      COCOM_MONGO_HOST: localhost:27017
      COCOM_MONGO_USER: cocom
      COCOM_MONGO_PASSWORD: cocom
      COCOM_MONGO_AUTHSOURCE: admin
      COCOM_MONGO_DATABASE: cocom
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '>=1.26.3'
          cache: true
      - name: Install WebP tools
        run: make install-webp-tools
      - name: Test with coverage
        run: make test-cover
      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: build/cover.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Coverage check
        run: make cover-check
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: build/cover.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '>=1.26.3'
          cache: true
      - name: Prepare version info
        run: make prepare
      - name: Run golangci-lint
        # 必须 pin 具体版本：action 只接受 v1.2 / v1.2.3 形式，"v2" 会被判为
        # invalid version string 而直接失败（此前 lint job 因此从未真正执行过 lint）。
        # 版本与本地验证一致（.golangci.yml 为 v2 配置格式）。
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.13.2
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '>=1.26.3'
          cache: true
      - name: Build
        run: make build-ci
      - name: Test all sub-modules
        # 现仓库仅根 module + tests/e2e 独立 module；此处保障后续新增独立 module 时其测试也被 CI 覆盖。
        run: make test-all

  sonar:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    services:
      # 提供真实 MongoDB：否则 cmd/server 的集成测试会静默 t.Skip（等于零覆盖）。
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: cocom
          MONGO_INITDB_ROOT_PASSWORD: cocom
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})' --username cocom --password cocom --authenticationDatabase admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # 与上方 service 凭据一致。键→环境变量映射由 SetEnvKeyReplacer 完成，它只把 "." 与 "-"
      # 换成 "_"，**不会在单词内部插入下划线** —— 因此 `mongo.authSource` 对应
      # COCOM_MONGO_AUTHSOURCE；写成 COCOM_MONGO_AUTH_SOURCE 会被 viper 忽略，authSource
      # 回落到默认值 cocom，而 service 的 root 用户建在 admin 库 → 认证失败
      # → cmd/server 的集成测试静默 t.Skip（即该 job 看似在跑集成，实则零覆盖）。
      COCOM_MONGO_HOST: localhost:27017
      COCOM_MONGO_USER: cocom
      COCOM_MONGO_PASSWORD: cocom
      COCOM_MONGO_AUTHSOURCE: admin
      COCOM_MONGO_DATABASE: cocom
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '>=1.26.3'
          cache: true
      - name: Install WebP tools
        run: make install-webp-tools
      - name: Test with coverage
        run: make test-cover
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # auto-push 需要
      deployments: write
      pull-requests: write # 允许创建PR Review评论
    needs: [unit-test]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '>=1.26.3'
          cache: true
      - name: Install WebP tools
        run: make install-webp-tools
      - name: Run benchmarks
        run: make bench
      - name: Static checks (notest / unsafe-listen)
        # 补回 make check-ci 之外被拆散的静态校验：notest 保证“每包必有测试”，
        # check-loopback 防止测试/生产代码出现 0.0.0.0 不安全监听（Windows 上自动回退）。
        run: |
          make notest
          make check-loopback
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba  # v1.22.1
        continue-on-error: true
        with:
          tool: go
          output-file-path: build/bench/bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          skip-fetch-gh-pages: false
          comment-always: true
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  playwright:
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '>=1.26.3'
          cache: true
      - name: Install Playwright browsers
        run: |
          # 版本与 tests/e2e/go.mod 的 playwright-go (v0.6100.0) 对齐，避免 go run @latest 漂移。
          go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6100.0 install --with-deps chromium
      - name: Run E2E tests
        run: go test -v -count=1 -timeout=5m ./...
        env:
          HEADLESS: "true"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-artifacts
          path: tests/e2e/screenshots/
          retention-days: 3
