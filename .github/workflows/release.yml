name: goreleaser

# 说明：本 workflow 只在 tag（v*）push 时触发。
# 若需要“master 普通 push 也跑一遍 goreleaser snapshot”，可临时加回
# `branches: [master]` 并配 `args: release --snapshot`，但会显著增加 CI 分钟数与并发失败面。

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '>=1.26.3'
          cache: true
      - name: Run GoReleaser
        # 固定 goreleaser 版本：与 .goreleaser.yaml `version: 2` 匹配，避免最新版行为漂移。
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.9.10
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_PAT 消费方：homebrew_casks 提交用（repository.token 指向 GH_PAT）。
          # GH_USER 无消费方（闲置；如需删除可在仓库 Settings→Secrets 手动删除，本文件不主动删除外部 secret）。
          GH_PAT: ${{ secrets.GH_PAT }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ github.token }}
